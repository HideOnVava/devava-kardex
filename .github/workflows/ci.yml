# Compila y corre las pruebas en cada push y pull request, en los tres sistemas.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Compilar y probar (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compilar y correr las pruebas
        shell: bash
        run: if [ "$RUNNER_OS" = Windows ]; then ./mvnw.cmd -B verify; else ./mvnw -B verify; fi
